name: Notebook Quality Check

on:
  pull_request:
    paths:
      - '**/*.ipynb'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/notebook-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need history to diff against the base branch
      
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0 (sha-pinned)
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Set up Python 3.11
        run: uv python install 3.11
      
      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras
      
      - name: Lint notebooks with Ruff
        run: |
          uv run ruff check **/*.ipynb --show-fixes || true
          uv run ruff format **/*.ipynb --check || true
      
      - name: Validate notebook structure
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PRs: validate the notebooks this PR adds or changes
            git fetch origin "$BASE_REF"
            git diff --name-only -z --diff-filter=d "origin/$BASE_REF"...HEAD -- '*.ipynb' > notebooks.lst
          else
            # Push and manual runs: validate every notebook
            git ls-files -z -- '*.ipynb' > notebooks.lst
          fi

          status=0
          xargs -0 -r uv run python scripts/validate_notebooks.py < notebooks.lst | tee validation_output.txt || status=1
          {
            echo "## Notebook structure"
            echo '```'
            if [ -s validation_output.txt ]; then cat validation_output.txt; else echo "No notebooks to validate"; fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $status

      # Runs every notebook against the live Anthropic API. Manual only: start it
      # from the Actions tab after adding an ANTHROPIC_API_KEY repository secret.
      # Each notebook failure is reported but does not fail the job.
      - name: Execute notebooks (API Testing)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p test_outputs
          for notebook in $(find . -name "*.ipynb" -not -path "*/.*" -not -path "*/test_outputs/*"); do
            echo "📓 Testing: $notebook"
            output_name=$(echo "$notebook" | sed 's|/|_|g' | sed 's|\.|_|g')
            # Use nbconvert to execute notebooks and save outputs
            uv run jupyter nbconvert --to notebook \
              --execute "$notebook" \
              --ExecutePreprocessor.kernel_name=python3 \
              --ExecutePreprocessor.timeout=120 \
              --output "test_outputs/${output_name}_executed.ipynb" \
              --output-dir=. \
              || echo "⚠️  Failed: $notebook"
          done
      
      # Mock testing for external contributors
      - name: Execute notebooks (Mock Testing)
        if: |
          github.event_name == 'pull_request' && 
          github.event.pull_request.author_association != 'MEMBER' &&
          github.event.pull_request.author_association != 'OWNER'
        run: |
          echo "🔒 Running in mock mode for external contributor"

          for notebook in $(find . -name "*.ipynb" -not -path "*/.*"); do
            echo "📓 Validating structure: $notebook"
            uv run python -m nbformat.validator "$notebook"
          done
      
      - name: Upload test outputs
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: notebook-test-outputs
          path: test_outputs/
          retention-days: 7
